name: tools

# Manual one-off jobs that need Yahoo access from GitHub's network.
on:
  workflow_dispatch:
    inputs:
      command:
        description: "Command to run"
        default: "python scripts/check_names.py"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ${{ github.event.inputs.command }}
