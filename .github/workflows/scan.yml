name: scan

# About every 15 minutes: refresh the fast-watch list (15m/1H/4H) and one slice of the
# daily scan, then publish the website. Price history is kept between runs in the
# Actions cache so each run only downloads the last few days from Yahoo.
#
# GitHub's own timer (schedule) is unreliable - it often skips hours - so each run
# starts the next one itself (last step). The schedule stays as a backup that
# restarts the chain if it ever breaks. Set the repo variable CHAIN=off to stop it.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      max:
        description: "Instruments in this run's daily slice"
        default: "600"

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore saved data
        uses: actions/cache/restore@v4
        with:
          path: |
            state
            site/data
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Refresh XTB instrument list (monthly)
        continue-on-error: true
        run: |
          if [ ! -f state/universe.json ] || [ -n "$(find state/universe.json -mtime +30)" ]; then
            python scripts/build_universe.py --download --to-state
          fi

      - name: Refresh TradingView symbols + Thai SET list (weekly)
        continue-on-error: true
        run: |
          if [ ! -f state/tv.json ] || [ -n "$(find state/tv.json -mtime +7)" ]; then
            python scripts/build_tv_map.py --to-state
          fi

      - name: Fast scan (15m / 1H / 4H)
        continue-on-error: true
        run: python run.py fast

      - name: Daily scan slice
        continue-on-error: true
        run: python run.py full --max ${{ github.event.inputs.max || '600' }}

      - name: Save data for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            state
            site/data
          key: data-${{ github.run_id }}

      - name: Use the fresh TradingView map
        run: if [ -f state/tv.json ]; then cp state/tv.json site/tv.json; fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Start the next run (in about 15 minutes)
        if: always() && vars.CHAIN != 'off'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 600
          # skip if another run is already waiting, so chains never pile up
          waiting=$(gh run list -R "$GITHUB_REPOSITORY" -w scan.yml -s queued --json databaseId -q length)
          pending=$(gh run list -R "$GITHUB_REPOSITORY" -w scan.yml -s pending --json databaseId -q length)
          if [ "${waiting:-0}" = "0" ] && [ "${pending:-0}" = "0" ]; then
            gh workflow run scan.yml -R "$GITHUB_REPOSITORY" --ref main
          else
            echo "another run is already queued - not starting one"
          fi
